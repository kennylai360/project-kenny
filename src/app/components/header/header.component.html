<nav>
  <div class="nav-links">
    <a class="nav-link" routerLink="/" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }" data-qa="qa-home-link">
      <fa-icon [icon]="icons.home" />
      <span class="nav-link__label">Home</span>
    </a>
    <a class="nav-link" routerLink="/resume" routerLinkActive="is-active" data-qa="qa-resume-link">
      <fa-icon [icon]="icons.resume" />
      <span class="nav-link__label">Resume</span>
    </a>
    <a class="nav-link" routerLink="/photography" routerLinkActive="is-active" data-qa="qa-photography-link">
      <fa-icon [icon]="icons.photography" />
      <span class="nav-link__label">Photography</span>
    </a>
    @if (blogEnabled) {
      <a class="nav-link" routerLink="/blog" routerLinkActive="is-active" data-qa="qa-blog-link">
        <fa-icon [icon]="icons.blog" />
        <span class="nav-link__label">Blog</span>
      </a>
    }
    <div class="nav-dropdown" [class.is-active]="miscActive()">
      <button
        type="button"
        class="nav-link nav-dropdown__toggle"
        aria-haspopup="menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="toggleMenu()"
        data-qa="qa-misc-menu"
      >
        <fa-icon [icon]="icons.misc" />
        <span class="nav-link__label">Misc</span>
        <fa-icon class="nav-dropdown__caret" [icon]="icons.caret" />
      </button>
      @if (menuOpen()) {
        <div
          class="nav-dropdown__menu"
          role="menu"
          animate.enter="nav-dropdown__menu--enter"
          animate.leave="nav-dropdown__menu--leave"
        >
          <a class="nav-dropdown__item" role="menuitem" routerLink="/converter" routerLinkActive="is-active" (click)="closeMenu()" data-qa="qa-converter-link">
            <fa-icon [icon]="icons.btcCalculator" />
            <span>BTC Calculator</span>
          </a>
          <a class="nav-dropdown__item" role="menuitem" routerLink="/utils" routerLinkActive="is-active" (click)="closeMenu()" data-qa="qa-table-link">
            <fa-icon [icon]="icons.copyCatMocking" />
            <span>Copycat</span>
          </a>
          <a class="nav-dropdown__item" role="menuitem" routerLink="/bomb-game" routerLinkActive="is-active" (click)="closeMenu()" data-qa="qa-bomb-game-link">
            <fa-icon [icon]="icons.bombGame" />
            <span>Bomb Game</span>
          </a>
        </div>
      }
    </div>
  </div>
  <div class="social-links">
    <a class="social-link" href="https://www.twitter.com/KENIII26" target="_blank" rel="noreferrer noopener" data-qa="qa-twitter-link">
      <fa-icon [icon]="icons.twitter" />
    </a>
    <a class="social-link" href="https://www.github.com/kennylai360" target="_blank" rel="noreferrer noopener" data-qa="qa-github-link">
      <fa-icon [icon]="icons.github" />
    </a>
  </div>
</nav>
