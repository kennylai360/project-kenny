<div class="album-page fade-in">
  <nav class="breadcrumb" aria-label="breadcrumb">
    <a class="breadcrumb__link" routerLink="/photography">Photography</a>
    <span class="breadcrumb__separator">/</span>
    <span class="breadcrumb__current">{{ albumData()?.albumTitle }}</span>
  </nav>

  <app-gallery-album-jumbotron
    [albumTitle]="albumData().albumTitle"
    [albumSubtitle]="albumData().albumSubtitle"
    [albumCoverPicture]="albumData().imgUrl"
    [socialMediaLinks]="albumData().socialMediaLinks"
  ></app-gallery-album-jumbotron>

  <div class="photo-grid">
    @for (item of albumData().albumImages; track item) {
      <div class="photo-grid__item">
        <app-gallery-album-cover
          (click)="openModal(item.imageId, item.imgUrl, item.horizontalOrient)"
          (hasImageLoadedEmitter)="allowOpenModal($event)"
          [imgUrl]="item.imgUrl"
          [translateX]="item.translateX"
          [translateY]="item.translateY"
        ></app-gallery-album-cover>
      </div>
    }
  </div>

  <app-overlay-container
    [albumSet]="albumData().albumImages"
  ></app-overlay-container>
</div>
